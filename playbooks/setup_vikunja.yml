- name: Setup VM in proxmox for vikunja
  hosts: vikunja
  gather_facts: false
  roles:
    - role: gijsentius.homelab.proxmox
      delegate_to: localhost

- name: Run common tasks
  hosts: vikunja
  gather_facts: true
  roles:
    - gijsentius.homelab.common

- name: Start vikunja on VM inside docker container
  hosts: vikunja
  gather_facts: true
  tasks:
    - name: Create snapshot of VM
      ansible.builtin.include_role:
        name: gijsentius.homelab.proxmox
        tasks_from: add_snapshot.yml
      when: host_snapshot

    - name: Setup docker on newly created VM
      ansible.builtin.include_role:
        name: gijsentius.homelab.docker

    - name: Create vikunja data directories
      ansible.builtin.file:
        path: "/home/{{ lookup('env', 'USER') }}/vikunja-data/{{ item }}"
        state: directory
        owner: "1000"
      become: true
      loop:
        - files
        - db

    - name: Start vikunja in Docker container
      community.docker.docker_container:
        name: vikunja
        image: vikunja/vikunja:latest
        env:
          VIKUNJA_SERVICE_PUBLICURL: "https://vikunja.gijsentius.org"
          VIKUNJA_SERVICE_ENABLEREGISTRATION: false
        volumes:
          - "/home/{{ lookup('env', 'USER') }}/vikunja-data/files:/app/vikunja/files"
          - "/home/{{ lookup('env', 'USER') }}/vikunja-data/db:/db"
        ports:
          - "3456:3456"
        restart_policy: "always"
        state: started

    - name: Start watchtower docker container
      community.docker.docker_container:
        name: watchtower
        image: containrrr/watchtower:latest
        env:
          TZ: Europe/Amsterdam
          PUID: '1000'
          PGID: '1000'
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        restart_policy: "always"
        state: started
